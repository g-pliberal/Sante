<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Santé : le programme libéral">
  <!-- L'icône du site : le carré de la charte — le vert profond de l'affiche —
       et le tracé « activity » de Lucide 1.46.0 (ISC), posé sur la grille de 24
       et au trait de 2, comme tous les pictogrammes du site. Un fichier et non
